[project]
name = "most-reviziya"
version = "0.1.0"
description = "Прокат Квота под тестами и в гексагоне: босс раздела PY12 BatSchool"
requires-python = ">=3.14"
# Пины те же, что в песочнице школы (runner-python-backend), плюс драйвер PostgreSQL.
dependencies = [
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.168.5",
    "mypy==1.18.2",
]

[tool.uv]
package = false
